<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">System mapping — what the operation made visible</title>
  <desc id="desc">A project-specific map of SUS CLINIC. Remake carried the design identity and vintage provided a familiar market entry. Partners, markets, content, Xiaohongshu, map discovery, and the physical shop were actual routes through which customers encountered the offer. Customer signals informed later judgment without proving causality. Space, people, time, labor, and operating costs formed the capacity needed to sustain those routes. The Xiaohongshu route later became unavailable; map discovery and returning customers remained but are not presented as a stable replacement acquisition system.</desc>
  <defs>
    <marker id="solidArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#4f8d38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="dashArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#85837b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="2400" height="1350" fill="#f5f3eb"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="110" y="105" font-size="34" font-weight="700" fill="#5e9e3a">05</text>
    <text x="195" y="108" font-size="58" font-weight="700" fill="#171717" letter-spacing="1">SYSTEM MAPPING</text>
    <text x="195" y="164" font-size="31" fill="#77766f">What the operation made visible</text>
    <line x1="110" y1="214" x2="2290" y2="214" stroke="#cbc8be" stroke-width="2"/>

    <text x="110" y="262" font-size="19" font-weight="700" fill="#5e9e3a" letter-spacing="2">01 / OFFER &amp; MARKET ENTRY</text>
    <text x="835" y="262" font-size="19" font-weight="700" fill="#5e9e3a" letter-spacing="2">02 / ROUTES TO CUSTOMERS</text>
    <text x="1720" y="262" font-size="19" font-weight="700" fill="#5e9e3a" letter-spacing="2">CUSTOMER ENCOUNTERS</text>

    <rect x="110" y="300" width="290" height="190" rx="18" fill="#171717"/>
    <text x="145" y="348" font-size="18" font-weight="700" fill="#8be447" letter-spacing="2">REMAKE</text>
    <text x="145" y="401" font-size="30" font-weight="700" fill="#fff">Design identity</text>
    <text x="145" y="443" font-size="22" fill="#c9c7bf">Core product line</text>

    <rect x="430" y="300" width="290" height="190" rx="18" fill="#fff" stroke="#cbc8be" stroke-width="2"/>
    <text x="465" y="348" font-size="18" font-weight="700" fill="#5e9e3a" letter-spacing="2">VINTAGE</text>
    <text x="465" y="401" font-size="30" font-weight="700" fill="#171717">Familiar entry</text>
    <text x="465" y="443" font-size="22" fill="#77766f">Complementary line</text>
    <path d="M255 515 V542 H575 V515" fill="none" stroke="#4f8d38" stroke-width="3"/>
    <text x="415" y="581" text-anchor="middle" font-size="22" font-weight="700" fill="#397039">Different roles within one offer</text>

    <rect x="835" y="300" width="335" height="112" rx="15" fill="#fff" stroke="#cbc8be" stroke-width="2"/>
    <text x="865" y="344" font-size="25" font-weight="700" fill="#171717">Partners + markets</text>
    <text x="865" y="382" font-size="19" fill="#77766f">Audience and contextual fit</text>
    <rect x="1200" y="300" width="335" height="112" rx="15" fill="#fff" stroke="#c86d64" stroke-width="3"/>
    <text x="1230" y="344" font-size="25" font-weight="700" fill="#171717">Xiaohongshu content</text>
    <text x="1230" y="382" font-size="19" fill="#a14f48">Route later became unavailable</text>
    <rect x="835" y="445" width="335" height="112" rx="15" fill="#fff" stroke="#cbc8be" stroke-width="2"/>
    <text x="865" y="489" font-size="25" font-weight="700" fill="#171717">Map discovery</text>
    <text x="865" y="527" font-size="19" fill="#77766f">Some new customers found the shop</text>
    <rect x="1200" y="445" width="335" height="112" rx="15" fill="#fff" stroke="#cbc8be" stroke-width="2"/>
    <text x="1230" y="489" font-size="25" font-weight="700" fill="#171717">Physical shop</text>
    <text x="1230" y="527" font-size="19" fill="#77766f">Visits and product encounters</text>

    <path d="M720 395 H790 V355 H817" fill="none" stroke="#4f8d38" stroke-width="3" marker-end="url(#solidArrow)"/>
    <path d="M720 395 H790 V501 H817" fill="none" stroke="#4f8d38" stroke-width="3" marker-end="url(#solidArrow)"/>
    <path d="M1170 355 H1182" stroke="#4f8d38" stroke-width="3" marker-end="url(#solidArrow)"/>
    <path d="M1170 501 H1182" stroke="#4f8d38" stroke-width="3" marker-end="url(#solidArrow)"/>

    <rect x="1720" y="300" width="570" height="257" rx="20" fill="#e7ebdf"/>
    <text x="1760" y="350" font-size="20" font-weight="700" fill="#397039" letter-spacing="2">OBSERVED IN OPERATION</text>
    <text x="1760" y="404" font-size="29" font-weight="700" fill="#171717">New discovery · shop visits</text>
    <text x="1760" y="450" font-size="29" font-weight="700" fill="#171717">Purchases · selected products</text>
    <line x1="1760" y1="478" x2="2250" y2="478" stroke="#bdc5b4" stroke-width="2"/>
    <text x="1760" y="519" font-size="21" fill="#5f625b">Returning customers = continued relationships,</text>
    <text x="1760" y="547" font-size="21" fill="#5f625b">not a new customer-acquisition channel</text>

    <path d="M1535 355 H1656 V392 H1702" fill="none" stroke="#4f8d38" stroke-width="3" marker-end="url(#solidArrow)"/>
    <path d="M1535 501 H1656 V466 H1702" fill="none" stroke="#4f8d38" stroke-width="3" marker-end="url(#solidArrow)"/>

    <path d="M2010 587 V633 H415 V604" fill="none" stroke="#85837b" stroke-width="2.5" stroke-dasharray="11 10" marker-end="url(#dashArrow)"/>
    <text x="1195" y="625" text-anchor="middle" font-size="19" font-weight="700" fill="#77766f" letter-spacing="1.2">OBSERVED CUSTOMER SIGNALS INFORMED LATER JUDGMENT</text>
    <text x="1195" y="654" text-anchor="middle" font-size="18" fill="#8d8b84">An observed feedback relationship, not a measured causal effect</text>

    <text x="110" y="730" font-size="19" font-weight="700" fill="#5e9e3a" letter-spacing="2">03 / CAPACITY TO SUSTAIN</text>
    <rect x="110" y="765" width="2180" height="238" rx="20" fill="#fff" stroke="#cbc8be" stroke-width="2"/>
    <line x1="650" y1="805" x2="650" y2="963" stroke="#dfdcd3" stroke-width="2"/>
    <line x1="1195" y1="805" x2="1195" y2="963" stroke="#dfdcd3" stroke-width="2"/>
    <line x1="1740" y1="805" x2="1740" y2="963" stroke="#dfdcd3" stroke-width="2"/>
    <text x="155" y="832" font-size="18" font-weight="700" fill="#5e9e3a" letter-spacing="2">SPACE &amp; DISPLAY</text>
    <text x="155" y="884" font-size="28" font-weight="700" fill="#171717">Made visits possible</text>
    <text x="155" y="925" font-size="20" fill="#77766f">Physical operating condition</text>
    <text x="695" y="832" font-size="18" font-weight="700" fill="#5e9e3a" letter-spacing="2">PEOPLE &amp; EXECUTION</text>
    <text x="695" y="884" font-size="28" font-weight="700" fill="#171717">Carried content and visits</text>
    <text x="695" y="925" font-size="20" fill="#77766f">Work had to be distributed</text>
    <text x="1240" y="832" font-size="18" font-weight="700" fill="#5e9e3a" letter-spacing="2">TIME &amp; LABOR</text>
    <text x="1240" y="884" font-size="28" font-weight="700" fill="#171717">Bounded what I could sustain</text>
    <text x="1240" y="925" font-size="20" fill="#77766f">Capacity was finite</text>
    <text x="1785" y="832" font-size="18" font-weight="700" fill="#5e9e3a" letter-spacing="2">OPERATING COSTS</text>
    <text x="1785" y="884" font-size="28" font-weight="700" fill="#171717">Shaped expansion conditions</text>
    <text x="1785" y="925" font-size="20" fill="#77766f">Individual effects were not measured</text>
    <path d="M380 765 V701" stroke="#aaa89f" stroke-width="2" stroke-dasharray="7 8"/>
    <path d="M925 765 V701" stroke="#aaa89f" stroke-width="2" stroke-dasharray="7 8"/>
    <path d="M1470 765 V701" stroke="#aaa89f" stroke-width="2" stroke-dasharray="7 8"/>
    <path d="M2015 765 V701" stroke="#aaa89f" stroke-width="2" stroke-dasharray="7 8"/>

    <rect x="110" y="1052" width="2180" height="190" rx="20" fill="#171717"/>
    <text x="158" y="1098" font-size="18" font-weight="700" fill="#8be447" letter-spacing="2">A PROJECT-SPECIFIC SYSTEM VIEW</text>
    <text x="158" y="1152" font-size="28" font-weight="700" fill="#fff">Operating SUS CLINIC made visible how the meaning of the offer, the ways customers encountered it,</text>
    <text x="158" y="1196" font-size="28" font-weight="700" fill="#fff">and the capacity required to sustain those routes depended on one another in practice.</text>
    <text x="2260" y="1305" font-size="24" font-weight="700" text-anchor="end" fill="#77766f">05</text>
  </g>
</svg>
