<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">System mapping — how SUS CLINIC held together</title>
  <desc id="desc">Remake and vintage shaped the offer. Partner fit, content, and shop visits formed routes to customers. Space, people, time, and costs supported those routes. The Xiaohongshu ban changed one discovery route, informing the decision about further investment.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#397039" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="grey-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 11 6 1 11" fill="none" stroke="#898980" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="2400" height="1350" fill="#f5f3eb"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="110" y="105" font-size="34" font-weight="700" fill="#5e9e3a">05</text>
    <text x="195" y="108" font-size="58" font-weight="700" fill="#171717" letter-spacing="1">SYSTEM MAPPING</text>
    <text x="195" y="164" font-size="31" fill="#77766f">The dependencies behind the next operating decision</text>
    <line x1="110" y1="214" x2="2290" y2="214" stroke="#cbc8be" stroke-width="2"/>

    <text x="110" y="266" font-size="20" font-weight="700" fill="#5e9e3a" letter-spacing="2">01 / PRODUCT &amp; POSITIONING</text>
    <text x="843" y="266" font-size="20" font-weight="700" fill="#5e9e3a" letter-spacing="2">02 / ROUTES TO CUSTOMERS</text>
    <text x="1575" y="266" font-size="20" font-weight="700" fill="#5e9e3a" letter-spacing="2">03 / RESPONSE IN PRACTICE</text>

    <text x="110" y="341" font-size="41" font-weight="700" fill="#171717">Remake made the work distinct.</text>
    <text x="110" y="397" font-size="33" fill="#4f4e49">Vintage offered a familiar</text>
    <text x="110" y="438" font-size="33" fill="#4f4e49">point of entry.</text>
    <text x="110" y="507" font-size="23" fill="#77766f">Two product roles within one offer</text>

    <text x="843" y="341" font-size="41" font-weight="700" fill="#171717">The offer had to be found.</text>
    <text x="843" y="397" font-size="33" fill="#4f4e49">Partner fit and content helped</text>
    <text x="843" y="438" font-size="33" fill="#4f4e49">people discover the shop.</text>
    <text x="843" y="507" font-size="23" fill="#77766f">Consignment / content / visits</text>

    <text x="1575" y="341" font-size="41" font-weight="700" fill="#171717">Customers tested the fit.</text>
    <text x="1575" y="397" font-size="33" fill="#4f4e49">Visits, purchases, and returns</text>
    <text x="1575" y="438" font-size="33" fill="#4f4e49">informed my judgment.</text>
    <text x="1575" y="507" font-size="23" fill="#77766f">Signals from actual operation</text>

    <path d="M715 403 H801" stroke="#397039" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M1448 403 H1533" stroke="#397039" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M2080 556 V592 H404 V556" stroke="#898980" stroke-width="2" fill="none" marker-end="url(#grey-arrow)"/>
    <text x="1030" y="580" text-anchor="middle" font-size="20" fill="#77766f" letter-spacing="1">FEEDBACK INTO POSITIONING</text>

    <rect x="110" y="641" width="2180" height="121" rx="15" fill="#e5eadf"/>
    <rect x="110" y="641" width="12" height="121" rx="6" fill="#5e9e3a"/>
    <text x="153" y="685" font-size="20" font-weight="700" fill="#397039" letter-spacing="2">A ROUTE CHANGED</text>
    <text x="153" y="731" font-size="27" fill="#30332d">The Xiaohongshu ban narrowed discovery; map listings and returning customers remained.</text>
    <path d="M1170 641 V539" stroke="#5e9e3a" stroke-width="3" stroke-dasharray="8 9" fill="none" marker-end="url(#arrow)"/>

    <text x="110" y="827" font-size="20" font-weight="700" fill="#5e9e3a" letter-spacing="2">THE CAPACITY SUPPORTING THESE ROUTES</text>
    <line x1="110" y1="853" x2="2290" y2="853" stroke="#9e9c91" stroke-width="2"/>
    <circle cx="300" cy="853" r="6" fill="#5e9e3a"/><circle cx="835" cy="853" r="6" fill="#5e9e3a"/><circle cx="1370" cy="853" r="6" fill="#5e9e3a"/><circle cx="1905" cy="853" r="6" fill="#5e9e3a"/>
    <text x="110" y="902" font-size="29" font-weight="700" fill="#171717">Space &amp; display</text>
    <text x="645" y="902" font-size="29" font-weight="700" fill="#171717">Part-time work</text>
    <text x="1180" y="902" font-size="29" font-weight="700" fill="#171717">My time &amp; labor</text>
    <text x="1715" y="902" font-size="29" font-weight="700" fill="#171717">Operating costs</text>
    <text x="110" y="943" font-size="22" fill="#77766f">Made visits possible</text>
    <text x="645" y="943" font-size="22" fill="#77766f">Carried content tasks</text>
    <text x="1180" y="943" font-size="22" fill="#77766f">Bounded what I could sustain</text>
    <text x="1715" y="943" font-size="22" fill="#77766f">Set the terms of expansion</text>

    <rect x="110" y="1022" width="2180" height="225" rx="18" fill="#171717"/>
    <text x="160" y="1074" font-size="20" font-weight="700" letter-spacing="2" fill="#8be447">NEXT-STAGE JUDGMENT</text>
    <text x="160" y="1134" font-size="36" font-weight="700" fill="#fff">Could I keep reaching customers at a time, labor, and expansion cost worth sustaining?</text>
    <text x="160" y="1199" font-size="26" fill="#d0d0cb">I chose not to invest in the next stage when it no longer aligned with my longer-term goals.</text>
    <text x="2260" y="1305" font-size="24" font-weight="700" text-anchor="end" fill="#77766f">05</text>
  </g>
</svg>
