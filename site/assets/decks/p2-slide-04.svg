<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
<title id="title">Disruption and recalibration — Xiaohongshu reach and account ban</title>
<desc id="desc">A Xiaohongshu post documenting organic reach and a cropped platform notice showing the off-platform traffic rule category. The account received a ban, three appeals failed, and map listings and returning customers brought some visits for a time.</desc>
<rect width="2400" height="1350" fill="#171717"/>
<text x="110" y="102" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#8be447">04</text>
<text x="195" y="108" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" letter-spacing="1" fill="#fff">DISRUPTION &amp; RECALIBRATION</text>
<text x="195" y="160" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#c9c7bf">A channel that had begun to work—and the rule boundary that closed it</text>
<rect x="110" y="220" width="1030" height="590" rx="24" fill="#f5f3eb"/>
<text x="155" y="280" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#77766f">ORGANIC REACH WAS TAKING SHAPE</text>
<image href="p2-xhs-organic-reach.jpg" x="155" y="310" width="430" height="430" preserveAspectRatio="xMidYMid meet"/>
<text x="625" y="380" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#171717">1,987 views</text>
<text x="625" y="425" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#5e5d57">65 likes · 16 May 2025</text>
<text x="625" y="510" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#171717">The post documents that</text>
<text x="625" y="548" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#171717">organic visibility had begun</text>
<text x="625" y="586" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#171717">to build before the ban.</text>
<rect x="1225" y="220" width="1065" height="590" rx="24" fill="#252724" stroke="#44483f" stroke-width="2"/>
<text x="1270" y="280" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#8be447">PLATFORM NOTICE</text>
<image href="p2-xhs-ban-notice.jpg" x="1270" y="310" width="500" height="360" preserveAspectRatio="xMidYMid meet"/>
<text x="1820" y="385" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#fff">ACCOUNT BANNED</text>
<text x="1820" y="445" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#c9c7bf">Reason stated by platform:</text>
<text x="1820" y="485" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#fff">off-platform traffic diversion</text>
<text x="1820" y="560" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#e8655c">3 appeals · none succeeded</text>
<text x="1270" y="745" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#aaa99f">Notice crop shows the rule category; account identifier is not included.</text>
<text x="110" y="875" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#aaa99f">ONE ACCOUNT CARRIED FOUR FUNCTIONS</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#fff">
  <rect x="110" y="905" width="500" height="78" rx="12" fill="#252724" stroke="#44483f" stroke-width="2"/><text x="360" y="954" text-anchor="middle">VISIBILITY</text>
  <rect x="640" y="905" width="500" height="78" rx="12" fill="#252724" stroke="#44483f" stroke-width="2"/><text x="890" y="954" text-anchor="middle">DISCOVERY</text>
  <rect x="1170" y="905" width="500" height="78" rx="12" fill="#252724" stroke="#44483f" stroke-width="2"/><text x="1420" y="954" text-anchor="middle">CONTACT</text>
  <rect x="1700" y="905" width="590" height="78" rx="12" fill="#252724" stroke="#44483f" stroke-width="2"/><text x="1995" y="954" text-anchor="middle">STORE VISITS</text>
</g>
<rect x="110" y="1030" width="2180" height="210" rx="24" fill="#f5f3eb"/>
<text x="155" y="1090" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#171717">After the ban, I did not rebuild the Xiaohongshu channel.</text>
<text x="155" y="1140" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#5e5d57">For a time, the shop’s map listing and returning customers still brought visits. I had concentrated too many functions</text>
<text x="155" y="1178" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#5e5d57">on my own capacity and underestimated their combined weight. The store is no longer operating.</text>
<text x="2260" y="1305" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="end" fill="#aaa99f">04</text>
</svg>
