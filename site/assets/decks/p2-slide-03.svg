<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
<title id="title">Network — building relationships beyond the space</title>
<desc id="desc">Consignment partnerships, market stalls, customer relationships, and two part-time roles. The comparison focuses on operational and cultural fit, without publishing sales figures.</desc>
<rect width="2400" height="1350" fill="#f5f3eb"/>
<text x="110" y="102" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#8be447">03</text>
<text x="195" y="108" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" letter-spacing="1" fill="#171717">NETWORK</text>
<text x="195" y="160" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#77766f">Building relationships beyond the space</text>
<text x="110" y="235" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#171717">A NETWORK BUILT THROUGH DIFFERENT ROUTES</text>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="110" y="265" width="475" height="88" rx="12" fill="#e7e4da"/><text x="145" y="320" font-size="25" font-weight="700" fill="#171717">CONSIGNMENT</text>
  <path d="M600 309h50m-14-14 14 14-14 14" fill="none" stroke="#8be447" stroke-width="6"/>
  <rect x="680" y="265" width="390" height="88" rx="12" fill="#e7e4da"/><text x="720" y="320" font-size="25" font-weight="700" fill="#171717">MARKET STALLS</text>
  <path d="M1085 309h50m-14-14 14 14-14 14" fill="none" stroke="#8be447" stroke-width="6"/>
  <rect x="1165" y="265" width="480" height="88" rx="12" fill="#e7e4da"/><text x="1205" y="320" font-size="25" font-weight="700" fill="#171717">CUSTOMER RELATIONSHIPS</text>
  <path d="M1660 309h50m-14-14 14 14-14 14" fill="none" stroke="#8be447" stroke-width="6"/>
  <rect x="1740" y="265" width="550" height="88" rx="12" fill="#171717"/><text x="1780" y="320" font-size="25" font-weight="700" fill="#8be447">PART-TIME SUPPORT</text>
</g>
<text x="110" y="420" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#77766f">TWO CONSIGNMENT PARTNERSHIPS</text>
<rect x="110" y="455" width="1060" height="260" rx="18" fill="#fff" stroke="#d8d4c9" stroke-width="2"/>
<rect x="110" y="455" width="14" height="260" rx="7" fill="#8be447"/>
<text x="160" y="520" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#171717">LOOP MIAO</text>
<text x="160" y="562" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#77766f">Xiamen Galaxy COCO Park Mall</text>
<text x="160" y="625" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#171717">Large-mall reach and a mature operating model.</text>
<text x="160" y="669" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#77766f">A wider network, with weaker day-to-day fit in this case.</text>
<rect x="1230" y="455" width="1060" height="260" rx="18" fill="#fff" stroke="#d8d4c9" stroke-width="2"/>
<rect x="1230" y="455" width="14" height="260" rx="7" fill="#8be447"/>
<text x="1280" y="520" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#171717">BUNBUN VINTAGE</text>
<text x="1280" y="562" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#77766f">DVLN PaRK</text>
<text x="1280" y="625" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#171717">A small private studio and closer cultural fit.</text>
<text x="1280" y="669" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#77766f">Practical connections supported customer discovery.</text>
<text x="110" y="785" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#77766f">DISTRIBUTING THE WORK</text>
<rect x="110" y="820" width="1060" height="280" rx="18" fill="#e7e4da"/>
<text x="155" y="880" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#e8655c">EARLIER PART-TIME ASSISTANT</text>
<text x="155" y="940" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#171717">Supported events for two months.</text>
<text x="155" y="988" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#5e5d57">Content tasks were repeatedly deferred;</text>
<text x="155" y="1028" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#5e5d57">the customer-acquisition loop stayed inactive.</text>
<rect x="1230" y="820" width="1060" height="280" rx="18" fill="#171717"/>
<text x="1275" y="880" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#8be447">XIAO ZHAO (PSEUDONYM) · PART-TIME</text>
<text x="1275" y="940" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#fff">Helped keep daily operations moving by carrying</text>
<text x="1275" y="980" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#fff">the content workflow through consistently.</text>
<text x="1275" y="1032" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#c9c7bf">Studied comparable stores; customer visits and popular</text>
<text x="1275" y="1065" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#c9c7bf">items became easier to track.</text>
<rect x="110" y="1150" width="2180" height="100" rx="18" fill="#171717"/>
<text x="155" y="1212" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#fff">In these partnerships, trust and cultural fit mattered more than scale alone.</text>
<text x="2260" y="1305" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="end" fill="#77766f">03</text>
</svg>
