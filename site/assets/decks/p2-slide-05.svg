<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
<title id="title">What the operation taught me — system mapping in practice</title>
<desc id="desc">A reflection on responsibility, control, coordination, and routes for correction under stress. I chose to stop operating when the next stage no longer aligned with my goals. This was a conclusion from exploration, not a failed case.</desc>
<rect width="2400" height="1350" fill="#f5f3eb"/>
<text x="110" y="102" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#8be447">05</text>
<text x="195" y="108" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" letter-spacing="1" fill="#171717">WHAT BECAME VISIBLE</text>
<text x="195" y="160" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#77766f">Mapping a commercial system through practice</text>
<g font-family="Arial,Helvetica,sans-serif">
  <rect x="110" y="230" width="1030" height="205" rx="22" fill="#fff" stroke="#d8d4c9" stroke-width="2"/><rect x="110" y="230" width="14" height="205" rx="7" fill="#e8655c"/>
  <text x="160" y="285" font-size="22" font-weight="700" letter-spacing="2" fill="#e8655c">OPERATING COSTS</text><text x="160" y="340" font-size="29" font-weight="700" fill="#171717">What did I need to account for?</text><text x="160" y="390" font-size="22" fill="#77766f">I tracked costs and kept spending within my planned limit.</text>
  <rect x="1230" y="230" width="1060" height="205" rx="22" fill="#fff" stroke="#d8d4c9" stroke-width="2"/><rect x="1230" y="230" width="14" height="205" rx="7" fill="#5578e8"/>
  <text x="1280" y="285" font-size="22" font-weight="700" letter-spacing="2" fill="#5578e8">MARKET FIT</text><text x="1280" y="340" font-size="29" font-weight="700" fill="#171717">How did customers find a point of entry?</text><text x="1280" y="390" font-size="22" fill="#77766f">Remake carried the identity; Vintage offered a familiar entry point.</text>
  <rect x="110" y="465" width="1030" height="205" rx="22" fill="#fff" stroke="#d8d4c9" stroke-width="2"/><rect x="110" y="465" width="14" height="205" rx="7" fill="#e5bd42"/>
  <text x="160" y="520" font-size="22" font-weight="700" letter-spacing="2" fill="#a7861d">OPERATIONS</text><text x="160" y="575" font-size="29" font-weight="700" fill="#171717">What had to work together?</text><text x="160" y="625" font-size="22" fill="#77766f">Space, product, people, channels, and customer routes.</text>
  <rect x="1230" y="465" width="1060" height="205" rx="22" fill="#fff" stroke="#d8d4c9" stroke-width="2"/><rect x="1230" y="465" width="14" height="205" rx="7" fill="#8be447"/>
  <text x="1280" y="520" font-size="22" font-weight="700" letter-spacing="2" fill="#4e9f1d">NEXT STAGE</text><text x="1280" y="575" font-size="29" font-weight="700" fill="#171717">When was further investment worthwhile?</text><text x="1280" y="625" font-size="21" fill="#77766f">I weighed expansion and ongoing costs against goals and learning.</text>
</g>
<rect x="110" y="725" width="2180" height="470" rx="24" fill="#171717"/>
<text x="165" y="790" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#8be447">A SYSTEM MAPPED THROUGH PRACTICE</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#fff">
  <text x="165" y="865">Building SUS CLINIC let me test how product, audience, channels, and operations fit together.</text>
  <text x="165" y="920">I assessed the next stage through its expansion and operating costs, as well as time, labor, learning value,</text>
  <text x="165" y="975">and my longer-term goals. The customer response informed my understanding of product and market fit,</text>
  <text x="165" y="1030">while the decision to continue required a separate assessment of investment and capacity.</text>
</g>
<text x="165" y="1135" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#c9c7bf">The store is no longer operating.</text>
<text x="2260" y="1305" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="end" fill="#77766f">05</text>
</svg>
